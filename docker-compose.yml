services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: appsfactoryerp-api
    restart: unless-stopped
    command: ["bun", "run", "start:prod"]
    environment:
      NODE_ENV: production
      PORT: 7502
      DATABASE_URL: ${DATABASE_URL}
      CLOUDFLARE_R2_ACCOUNT_ID: ${CLOUDFLARE_R2_ACCOUNT_ID:-}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-}
      CLOUDFLARE_R2_PUBLIC_URL: ${CLOUDFLARE_R2_PUBLIC_URL:-}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:7502/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: appsfactoryerp-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-9080}:80"

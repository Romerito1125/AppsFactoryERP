services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: appsfactoryerp-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 7502
      DATABASE_URL: ${DATABASE_URL}

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: appsfactoryerp-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
